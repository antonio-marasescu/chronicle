<div role="tablist" class="tabs tabs-lifted tabs-lg mb-6">
  <button
    role="tab"
    class="tab text-xl md:text-2xl lg:text-3xl px-4 py-2 md:px-6 md:py-3 lg:px-8 lg:py-4"
    [class.tab-active]="activeTab() === 'overview'"
    (click)="tabChange.emit('overview')"
  >
    Overview
  </button>
  <button
    role="tab"
    class="tab text-xl md:text-2xl lg:text-3xl px-4 py-2 md:px-6 md:py-3 lg:px-8 lg:py-4"
    [class.tab-active]="activeTab() === 'world'"
    (click)="tabChange.emit('world')"
  >
    World
  </button>
  <button
    role="tab"
    class="tab text-xl md:text-2xl lg:text-3xl px-4 py-2 md:px-6 md:py-3 lg:px-8 lg:py-4"
    [class.tab-active]="activeTab() === 'chapters'"
    (click)="tabChange.emit('chapters')"
  >
    Chapters
  </button>
  <button
    role="tab"
    class="tab text-xl md:text-2xl lg:text-3xl px-4 py-2 md:px-6 md:py-3 lg:px-8 lg:py-4"
    [class.tab-active]="activeTab() === 'npcs'"
    (click)="tabChange.emit('npcs')"
  >
    NPCs
  </button>
</div>
