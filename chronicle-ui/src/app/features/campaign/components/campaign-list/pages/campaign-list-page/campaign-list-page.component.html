<div class="min-h-screen bg-base-200 p-6">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Campaigns</h1>
    <button class="btn btn-primary btn-lg" (click)="onCreateCampaign()">
      <span class="material-icons">add</span>
      Create Campaign
    </button>
  </div>
  @if (isLoading()) {
    <app-loading-spinner message="Loading campaigns..." />
  } @else if (campaigns(); as campaignList) {
    <app-campaign-list-view
      [campaigns]="campaignList"
      (viewCampaign)="onViewCampaign($event)"
      (editCampaign)="onEditCampaign($event)"
    />
  } @else {
    <div class="text-center text-base-content/70 p-12">No campaigns found</div>
  }
</div>
