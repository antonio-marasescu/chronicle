<div
  class="card bg-base-100 border-r border-base-300 w-96 rounded-none shadow-xl h-full overflow-y-auto"
>
  <div class="card-body p-6 space-y-4">
    <h3 class="card-title text-xl flex items-center gap-2">
      <span class="material-icons text-primary text-2xl">settings</span>
      Location Settings
    </h3>

    <div class="form-control">
      <label class="label">
        <span class="label-text text-base font-medium">Name</span>
      </label>
      <input
        type="text"
        [value]="metadata().name"
        (input)="onNameChange($event)"
        placeholder="Location name"
        class="input input-bordered input-md w-full"
      />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text text-base font-medium">Type</span>
      </label>
      <select
        [value]="metadata().locationType"
        (change)="onLocationTypeChange($event)"
        class="select select-bordered select-md w-full"
      >
        @for (type of locationTypes; track type) {
          <option [value]="type">
            {{ type.charAt(0).toUpperCase() + type.slice(1) }}
          </option>
        }
      </select>
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text text-base font-medium">Description</span>
      </label>
      <textarea
        [value]="metadata().description"
        (input)="onDescriptionChange($event)"
        placeholder="Brief description"
        class="textarea textarea-bordered textarea-md w-full h-24"
      ></textarea>
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text text-base font-medium">Backstory</span>
      </label>
      <textarea
        [value]="metadata().backstory"
        (input)="onBackstoryChange($event)"
        placeholder="Historical background"
        class="textarea textarea-bordered textarea-md w-full h-28"
      ></textarea>
    </div>

    <div class="divider my-3"></div>

    <h4 class="font-semibold text-base flex items-center gap-2">
      <span class="material-icons text-xl">palette</span>
      Marker Style
    </h4>

    <div class="form-control">
      <label class="label">
        <span class="label-text text-base font-medium">Color</span>
      </label>
      <div class="flex gap-3 items-center">
        <input
          type="color"
          [value]="metadata().color"
          (input)="onColorChange($event)"
          class="w-16 h-12 rounded cursor-pointer"
        />
        <input
          type="text"
          [value]="metadata().color"
          (input)="onColorChange($event)"
          class="input input-bordered input-md flex-1"
        />
      </div>
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text text-base font-medium">Size: {{ metadata().size }}px</span>
      </label>
      <input
        type="range"
        min="12"
        max="40"
        [value]="metadata().size"
        (input)="onSizeChange($event)"
        class="range range-md"
      />
      <div class="flex justify-between text-sm px-2 mt-1">
        <span>Small</span>
        <span>Large</span>
      </div>
    </div>

    <div class="divider my-3"></div>

    <div class="space-y-3">
      <span class="text-base font-semibold flex items-center gap-2">
        <span class="material-icons text-xl">visibility</span>
        Preview
      </span>
      <div class="flex items-center gap-3 p-4 bg-base-200 rounded-lg border border-base-300">
        <div class="relative">
          <div
            class="rounded-full border-2 border-white shadow-lg flex items-center justify-center transition-all"
            [style.background-color]="metadata().color"
            [style.width.px]="metadata().size * 2"
            [style.height.px]="metadata().size * 2"
          >
            <img
              [src]="getLocationIconPath(metadata().locationType)"
              alt="Location icon"
              class="w-full h-full p-1"
              [style.width.px]="metadata().size * 1.2"
              [style.height.px]="metadata().size * 1.2"
            />
          </div>
        </div>
        <div class="flex-1 min-w-0">
          @if (metadata().name) {
            <div class="text-base font-medium truncate">{{ metadata().name }}</div>
          } @else {
            <div class="text-base text-base-content/50 italic">No name</div>
          }
          <div class="text-sm text-base-content/70">
            {{ metadata().locationType.charAt(0).toUpperCase() + metadata().locationType.slice(1) }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
