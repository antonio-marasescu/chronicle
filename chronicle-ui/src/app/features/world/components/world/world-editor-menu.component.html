<div class="flex flex-col gap-2 bg-base-100 border-r border-base-300 p-3 w-16">
  @for (item of menuItems(); track item.action) {
    @if (item.action === WorldEditorMenuAction.UPLOAD_FILE) {
      <button
        class="btn btn-square btn-sm btn-ghost tooltip tooltip-right"
        [attr.data-tip]="item.label"
        (click)="fileInputElement.click()"
      >
        <span class="material-icons text-lg">{{ item.icon }}</span>
      </button>
    } @else {
      <button
        class="btn btn-square btn-sm tooltip tooltip-right"
        [class.btn-primary]="item.action === selectedAction()"
        [class.btn-ghost]="item.action !== selectedAction()"
        [attr.data-tip]="item.label"
        (click)="onActionButtonClick(item.action)"
      >
        <span class="material-icons text-lg">{{ item.icon }}</span>
      </button>
    }
    @if (item.dividerAfter) {
      <div class="divider my-1"></div>
    }
  }

  <input
    type="file"
    accept="image/*"
    class="hidden"
    #fileInputElement
    (change)="onFileSelected(fileInputElement)"
  />
</div>
