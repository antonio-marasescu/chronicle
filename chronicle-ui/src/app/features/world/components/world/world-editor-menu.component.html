<div class="flex flex-col gap-3 bg-base-100 border-r border-base-300 p-4 w-20 shadow-md">
  @for (item of menuItems(); track item.action) {
    @if (item.action === WorldEditorMenuAction.UPLOAD_FILE) {
      <button
        class="btn btn-square btn-md btn-ghost tooltip tooltip-right hover:btn-primary transition-colors"
        [attr.data-tip]="item.label"
        (click)="fileInputElement.click()"
      >
        <span class="material-icons text-2xl">{{ item.icon }}</span>
      </button>
    } @else {
      <button
        class="btn btn-square btn-md tooltip tooltip-right transition-all"
        [class.btn-primary]="item.action === selectedAction()"
        [class.btn-ghost]="item.action !== selectedAction()"
        [class.shadow-lg]="item.action === selectedAction()"
        [attr.data-tip]="item.label"
        (click)="onActionButtonClick(item.action)"
      >
        <span class="material-icons text-2xl">{{ item.icon }}</span>
      </button>
    }
    @if (item.dividerAfter) {
      <div class="divider my-2"></div>
    }
  }

  <input
    type="file"
    accept="image/*"
    class="hidden"
    #fileInputElement
    (change)="onFileSelected(fileInputElement)"
  />
</div>
